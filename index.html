<!DOCTYPE html>
<html>

<head>

    <title>Login Page</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-container">

        <h2>Login</h2>

        <form>

            <label>Email</label>

            <input
                type="email"
                placeholder="Enter your email">

            <label>Password</label>

            <input
                type="password"
                placeholder="Enter your password">

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>

            <button type="submit">
                Login
            </button>

            <p>
                Don't have an account?
                <a href="#">
                    Sign Up
                </a>
            </p>

        </form>

    </div>

</body>

</html>
